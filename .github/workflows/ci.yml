# Typecheck + lint + build on every push/PR, plus a drift check that fails when
# src/lib/schema-sql.ts wasn't regenerated after editing supabase/migrations/.
# The build needs no secrets (env helpers fall back to empty strings), so this
# runs on a bare runner.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run gen:schema:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
